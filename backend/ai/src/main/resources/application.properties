
spring.application.name=ai
server.port=${AI_SERVER_PORT:8081}

# Qdrant vector store
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION:incident-pilot}
spring.ai.vectorstore.qdrant.initialize-schema=${QDRANT_INITIALIZE_SCHEMA:true}

# Ollama connection
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# Chat model
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen3:1.7b}

# Embedding model
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.document-ingestion=${DOCUMENT_INGESTION_TOPIC:incidentpilot.document-ingestion}

# JWT secret — provide a secure secret through the environment
jwt.secret=K9vR2xM7qP4nL8aT5wF1cD6hJ3sB0yGzU9eX4kN7mQ2pV5rA8dC1fH6jL3tW0bY
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}}

# Resilience4j circuit breaker
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ai-service.permitted-number-of-calls-in-half-open-state=2
