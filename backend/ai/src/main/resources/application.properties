
# Application
spring.application.name=${SPRING_APPLICATION_NAME:ai}
server.port=${AI_SERVER_PORT:8081}

# Qdrant Vector Store
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION:incident-pilot}
spring.ai.vectorstore.qdrant.initialize-schema=${QDRANT_INITIALIZE_SCHEMA:true}

# Ollama Connection
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# Chat Model
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen3:1.7b}

# Embedding Model
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.document-ingestion=${DOCUMENT_INGESTION_TOPIC:incidentpilot.document-ingestion}
app.kafka.consumer.container-factory=${KAFKA_CONSUMER_CONTAINER_FACTORY:incidentDocumentKafkaListenerContainerFactory}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:incidentpilot-ai-group}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}


# Kafka JSON Deserialization
app.kafka.consumer.trusted-packages=${KAFKA_TRUSTED_PACKAGES:com.incidentpilot.ai.event}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Incident Document Chunking
incidentpilot.rag.chunk-size=${RAG_CHUNK_SIZE:300}
incidentpilot.rag.min-chunk-size=${RAG_MIN_CHUNK_SIZE:100}
incidentpilot.rag.min-chunk-length-to-embed=${RAG_MIN_CHUNK_LENGTH_TO_EMBED:5}
incidentpilot.rag.max-chunks=${RAG_MAX_CHUNKS:10000}
incidentpilot.rag.keep-separator=${RAG_KEEP_SEPARATOR:true}

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=${AI_CB_SLIDING_WINDOW_SIZE:5}
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=${AI_CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=${AI_CB_WAIT_DURATION:30s}
resilience4j.circuitbreaker.instances.ai-service.permitted-number-of-calls-in-half-open-state=${AI_CB_HALF_OPEN_CALLS:2}


# Authentication is JWT-only: stop Spring Boot generating (and logging) a default user password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
