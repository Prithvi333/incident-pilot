spring:
  application:
    name: incident-pilot

  # H2 in-memory database for development — swap to MySQL later
  datasource:
    url: jdbc:h2:mem:incidentpilot
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: aW5jaWRlbnRwaWxvdC1kZXYtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1obWFjLXNoYTI1Ng==
  expiration-ms: 86400000
