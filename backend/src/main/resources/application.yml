spring:
  application:
    name: incident-pilot

  # H2 in-memory database for development — swap to MySQL later
  datasource:
    url: jdbc:h2:mem:incidentpilot
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: incident-pilot
        initialize-schema: true

server:
  port: 8080

jwt:
  secret: aW5jaWRlbnRwaWxvdC1kZXYtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1obWFjLXNoYTI1Ng==
  expiration-ms: 86400000

aws:
  s3:
    bucket: incident-pilot-docs
    region: us-east-1

resilience4j:
  circuitbreaker:
    instances:
      ai-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
