spring.application.name=incident-pilot
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.qdrant.autoconfigure.QdrantVectorStoreAutoConfiguration

# MySQL database
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:incidentpilot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root121}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS Bedrock AI (uses DefaultCredentialsProvider — same as S3)
spring.ai.bedrock.aws.region=${AWS_REGION:ap-south-1}
spring.ai.bedrock.converse.chat.options.model=anthropic.claude-3-sonnet-20240229-v1:0

# Spring AI — Qdrant vector store (excluded by default, enable when Qdrant is running)
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=incident-pilot
spring.ai.vectorstore.qdrant.initialize-schema=true

server.port=8080

jwt.secret=aW5jaWRlbnRwaWxvdC1kZXYtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1obWFjLXNoYTI1Ng==
jwt.expiration-ms=86400000

aws.s3.bucket=incident-pilot-docs
aws.s3.region=ap-south-1

# Resilience4j circuit breaker
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ai-service.permitted-number-of-calls-in-half-open-state=2
