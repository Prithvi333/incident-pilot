spring.application.name=incident-pilot

# Exclude Spring AI auto-configs that conflict with our beans:
# - BedrockConverseProxyChat: references BedrockProxyChatModel which doesn't exist in Spring AI 1.0.0
# - BedrockCohereEmbedding: would create a second EmbeddingModel bean conflicting with Titan
spring.autoconfigure.exclude=\
  org.springframework.ai.model.bedrock.converse.autoconfigure.BedrockConverseProxyChatAutoConfiguration,\
  org.springframework.ai.model.bedrock.cohere.autoconfigure.BedrockCohereEmbeddingAutoConfiguration

# MySQL database
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:incidentpilot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS credentials — fill in here for local dev, later switch to env vars
aws.credentials.access-key-id=${AWS_ACCESS_KEY_ID}
aws.credentials.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# AWS Bedrock AI
# Credentials for Spring AI auto-config (reads these for Titan embedding)
spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY_ID}
spring.ai.bedrock.aws.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.ai.bedrock.aws.region=${AWS_REGION:ap-south-1}
# Model ID must be an inference profile ID, not a raw model ID (Bedrock on-demand requirement)
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_CHAT_MODEL:in.anthropic.claude-haiku-4-5-20251001-v1:0}
# Titan Embed Text V2 for vector embeddings (auto-configured)
spring.ai.bedrock.titan.embedding.model=${BEDROCK_EMBEDDING_MODEL:amazon.titan-embed-text-v2:0}
spring.ai.bedrock.titan.embedding.input-type=TEXT

# Spring AI — Qdrant vector store (excluded by default, enable when Qdrant is running)
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=incident-pilot
spring.ai.vectorstore.qdrant.initialize-schema=true

server.port=8080

jwt.secret=${JWT_SECRET:aW5jaWRlbnRwaWxvdC1kZXYtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLWZvci1obWFjLXNoYTI1Ng==}
jwt.expiration-ms=86400000

aws.s3.bucket=${AWS_S3_BUCKET:incident-pilot-docs}
aws.s3.region=${AWS_REGION:ap-south-1}

# Resilience4j circuit breaker
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ai-service.permitted-number-of-calls-in-half-open-state=2
