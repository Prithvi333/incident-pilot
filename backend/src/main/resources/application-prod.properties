spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:incidentpilot}?useSSL=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:incidentpilot}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.devtools.restart.enabled=false

# AWS Bedrock AI (uses DefaultCredentialsProvider)
spring.ai.bedrock.aws.region=${AWS_REGION:ap-south-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_CHAT_MODEL:in.anthropic.claude-haiku-4-5-20251001-v1:0}

aws.s3.bucket=${AWS_S3_BUCKET:incident-pilot-docs}
aws.s3.region=${AWS_REGION:ap-south-1}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

logging.level.root=WARN
logging.level.com.incidentpilot=INFO
logging.level.org.hibernate.SQL=WARN
