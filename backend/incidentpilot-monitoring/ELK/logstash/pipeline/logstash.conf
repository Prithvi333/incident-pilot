input {
  beats {
    port => 5044
  }
}

filter {
  # Parse Spring Boot JSON logs
  if [message] {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    if [parsed] {
      mutate {
        rename => {
          "[parsed][@timestamp]" => "[@metadata][timestamp]"
          "[parsed][@version]"   => "[@metadata][version]"
          "[parsed][message]"   => "message"
          "[parsed][logger_name]" => "logger_name"
          "[parsed][thread_name]" => "thread_name"
          "[parsed][level]" => "level"
          "[parsed][level_value]" => "level_value"
        }

        add_field => {
          "application" => "incidentpilot"
        }
      }

      date {
        match => ["[@metadata][timestamp]", "ISO8601"]
        target => "@timestamp"
      }

      mutate {
        remove_field => ["parsed"]
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:http://elasticsearch:9200}"]

    user => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD}"

    index => "incidentpilot-logs-%{+YYYY.MM.dd}"
}

  stdout {
    codec => rubydebug
  }
}


