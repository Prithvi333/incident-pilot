
spring.application.name=ingestion
server.port=${SERVER_PORT:8082}

# MySQL database
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:incidentpilot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root121}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.document-ingestion=${DOCUMENT_INGESTION_TOPIC:incidentpilot.document-ingestion}

# File upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# JWT
jwt.secret=K9vR2xM7qP4nL8aT5wF1cD6hJ3sB0yGzU9eX4kN7mQ2pV5rA8dC1fH6jL3tW0bY
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}0}

# AWS S3
aws.s3.bucket=${AWS_S3_BUCKET:incident-pilot-docs121}
aws.s3.region=${AWS_REGION:ap-south-1}

# AI service URL
services.ai.url=${AI_SERVICE_URL:http://localhost:8081}

# AWS credentials
aws.credentials.access-key-id=${AWS_ACCESS_KEY_ID}
aws.credentials.secret-access-key=${AWS_SECRET_ACCESS_KEY}
