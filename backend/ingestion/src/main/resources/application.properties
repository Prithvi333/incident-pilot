
# ==========================================
# Application
# ==========================================
spring.application.name=ingestion
server.port=${INGESTION_PORT:8082}


# ==========================================
# MySQL Database
# ==========================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:incidentpilot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}


# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ==========================================
# Kafka
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.document-ingestion=${DOCUMENT_INGESTION_TOPIC:incidentpilot.document-ingestion}


# ==========================================
# File Upload Limits
# ==========================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}


# ==========================================
# JWT Authentication
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# AWS S3
# ==========================================
aws.s3.bucket=${AWS_S3_BUCKET:incident-pilot-docs121}
aws.s3.region=${AWS_REGION:ap-south-1}


# ==========================================
# AI Service
# ==========================================
services.ai.url=${AI_SERVICE_URL:http://localhost:8081}


# ==========================================
# AWS Credentials
# ==========================================
aws.credentials.access-key-id=${AWS_ACCESS_KEY_ID}
aws.credentials.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# Authentication is JWT-only: stop Spring Boot generating (and logging) a default user password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
