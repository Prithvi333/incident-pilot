
services:
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incidentpilot-ingestion
    ports:
      - "${INGESTION_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    networks:
      - incidentpilot-network
    restart: unless-stopped

networks:
  incidentpilot-network:
    external: true
    name: incidentpilot-network
