
services:
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incidentpilot-ingestion
    ports:
      - "${INGESTION_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

      # Shared HMAC key: must be identical in the incident, ingestion and ai services
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (base64) in .env}

      # S3 document storage (values come from your untracked .env; nothing is hardcoded here)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-incident-pilot-docs}

    networks:
      - incidentpilot-network
    restart: unless-stopped

networks:
  incidentpilot-network:
    external: true
    name: incidentpilot-network
