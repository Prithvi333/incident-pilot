
services:
  # ==========================================
  # IncidentPilot Backend
  # ==========================================
  incident:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incidentpilot-backend
    ports:
      - "${INCIDENT_PORT:-8080}:8080"

    environment:
      # Application
      INCIDENT_PORT: 8080
      LOG_FILE: ${LOG_FILE:-logs/incidentpilot.log}

      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-incidentpilot}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-incidentpilot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_ROOT_PASSWORD}}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-vN8pQ4xL2mR7kT9wF5aC1dH6jB3yG0zE8uX4sK9pM2qV7rA5}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DOCUMENT_INGESTION_TOPIC: ${DOCUMENT_INGESTION_TOPIC:-incidentpilot.document-ingestion}

      # AI Service
      AI_SERVICE_URL: http://ai:8081

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis121}

      # CORS / WebSocket
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"

    networks:
      - incidentpilot-network

    restart: unless-stopped

# ==========================================
# Connect to Infrastructure Network
# ==========================================
networks:
  incidentpilot-network:
    external: true
    name: incidentpilot-network
