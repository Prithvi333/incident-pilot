
# ==========================================
# Application
# ==========================================
spring.application.name=incident-pilot
server.port=${INCIDENT_PORT:8080}


# ==========================================
# MySQL Database
# ==========================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:incidentpilot}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ==========================================
# Logging
# ==========================================
logging.file.name=${LOG_FILE:logs/incidentpilot.log}
logging.structured.format.file=logstash


# ==========================================
# JWT Authentication
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# Kafka
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.document-ingestion=${DOCUMENT_INGESTION_TOPIC:incidentpilot.document-ingestion}


# ==========================================
# AI Service
# ==========================================
services.ai.url=${AI_SERVICE_URL:http://localhost:8081}


# ==========================================
# Actuator Health Endpoints
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true


# ==========================================
# CORS / WebSocket
# ==========================================
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost,http://localhost:*,http://127.0.0.1:*,http://10.0.0.12}

# Authentication is JWT-only: stop Spring Boot generating (and logging) a default user password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Redis read cache (tenant-scoped keys, TTLs). Redis is optional: failures fall back to MySQL.
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
# A cache outage must not mark the whole service unhealthy
management.health.redis.enabled=false

# Circuit breaker around the AI service (similar-incident insights are optional)
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.ai-service.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ai-service.permitted-number-of-calls-in-half-open-state=2

# Transactional outbox relay (incident events -> Kafka -> Qdrant)
outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:2000}
